version: 2

models:
  - name: vw_hed_student_success_kpi
    description: "Executive-level KPI dashboard summarizing key student success metrics across enrollment, academic performance, engagement, financial aid, and interventions. Single-row summary view for dashboards and executive reporting."
    columns:
      - name: total_students
        description: "Total count of unique students"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: at_risk_students
        description: "Number of students flagged as at-risk for retention"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: at_risk_percentage
        description: "Percentage of students at retention risk"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_gpa
        description: "Average GPA across all students"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 4
      - name: avg_completion_rate_pct
        description: "Average course completion rate as percentage"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_assignment_score
        description: "Average assignment score across all students"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: credit_hour_success_rate
        description: "Percentage of attempted credit hours successfully earned"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_engagement_score
        description: "Average student engagement score (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_course_views
        description: "Average number of course material views per student"
      - name: avg_assignments_submitted
        description: "Average number of assignments submitted per student"
      - name: avg_discussion_posts
        description: "Average number of discussion posts per student"
      - name: total_plagiarism_incidents
        description: "Total academic integrity violations across all students"
      - name: students_with_incidents_pct
        description: "Percentage of students with at least one plagiarism incident"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_writing_quality_score
        description: "Average writing quality assessment score"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_financial_aid
        description: "Total financial aid distributed to all students"
      - name: avg_financial_aid_per_student
        description: "Average financial aid amount per student"
      - name: students_receiving_aid
        description: "Number of students receiving financial aid"
      - name: financial_aid_coverage_pct
        description: "Percentage of students receiving financial aid"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_interventions
        description: "Total academic interventions/support sessions"
      - name: avg_interventions_per_student
        description: "Average number of interventions per student"
      - name: students_with_interventions
        description: "Number of students who have received interventions"
      - name: last_data_refresh
        description: "Timestamp of most recent data update"
      - name: report_generated_at
        description: "Timestamp when this view was queried"

  - name: vw_hed_retention_risk_analysis
    description: "Student-level retention risk analysis, one row per at-risk student (filtered to at_risk_flag = true). Exposes academic, engagement, financial, intervention, and integrity risk factors with their risk levels, an overall risk assessment, and recommended interventions. Ordered by severity (Critical first), then lowest GPA and engagement. Source table for the sv_hed_at_risk_students Snowflake semantic view."
    columns:
      - name: student_id
        description: "Unique student identifier"
        data_tests:
          - not_null
          - unique
      - name: major_code
        description: "Student's academic major code (e.g., ENGR, BUSN, NURS)"
        data_tests:
          - not_null
      - name: advisor_id
        description: "Assigned academic advisor"
      - name: academic_standing
        description: "Current academic status (e.g., Good Standing, Academic Probation)"
        data_tests:
          - not_null
      - name: at_risk_flag
        description: "Boolean retention risk flag (always TRUE in this view)"
        data_tests:
          - not_null
      - name: current_gpa
        description: "Current cumulative GPA on a 0-4 scale"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 4
      - name: gpa_risk_level
        description: "GPA risk bucket: Critical (< 2.0), High (< 2.5), Moderate (< 3.0), Low (>= 3.0)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: course_completion_rate
        description: "Share of courses completed, on a 0-1 scale"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: completion_risk_level
        description: "Course completion risk bucket: Critical (< 0.50), High (< 0.70), Moderate (< 0.85), Low (>= 0.85)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: engagement_score
        description: "Composite engagement metric (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: engagement_risk_level
        description: "Engagement risk bucket: Critical (score < 30), High (< 50), Moderate (< 70), Low (>= 70)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: total_course_views
        description: "Total number of course material views"
      - name: assignment_submissions
        description: "Number of assignments submitted"
      - name: discussion_posts
        description: "Number of discussion forum posts"
      - name: days_since_last_login
        description: "Days between last LMS login and the current date (recalculated at query time)"
      - name: login_recency_risk_level
        description: "Login recency risk bucket: Critical (> 14 days since last login), High (> 7), Moderate (> 3), Low (<= 3)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: financial_aid_amount
        description: "Total financial aid received"
      - name: financial_aid_category
        description: "Financial aid classification: No Aid (amount = 0), Partial Aid (< 10,000), Full Support (>= 10,000)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Aid', 'Partial Aid', 'Full Support']
      - name: intervention_count
        description: "Number of academic interventions/support sessions received"
      - name: intervention_category
        description: "Intervention frequency: High Intervention (5+), Moderate Intervention (2-4), Low Intervention (1), No Intervention (0)"
        data_tests:
          - not_null
      - name: plagiarism_incidents
        description: "Number of academic integrity violations"
      - name: writing_quality_score
        description: "Writing assessment score (0-100)"
      - name: overall_risk_assessment
        description: "Most severe of the GPA, completion, engagement, and login recency risk levels: Critical - Immediate Intervention, High - Priority Attention, Moderate - Monitor Closely, or Low - Standard Support"
        data_tests:
          - not_null
      - name: recommended_action
        description: "Semicolon-separated list of recommended interventions, mapped one-to-one from overall_risk_assessment"
        data_tests:
          - not_null
      - name: enrollment_date
        description: "Date the student enrolled"
      - name: last_login_date
        description: "Most recent LMS login timestamp"
      - name: last_updated
        description: "Timestamp of last source record update"


  - name: vw_hed_program_performance
    description: "Academic program performance by major, one row per major_code. Compares enrollment, academic outcomes, retention risk, engagement, integrity, financial aid, and interventions, and rolls them into a weighted program health score with a rank, quartile, and performance category. Ordered by program_health_score descending."
    columns:
      - name: major_code
        description: "Academic major code (grain of this view)"
        data_tests:
          - not_null
          - unique
      - name: total_students
        description: "Number of distinct students in this major"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: advisors_assigned
        description: "Number of distinct advisors assigned to students in this major"
      - name: avg_students_per_advisor
        description: "Distinct students divided by distinct advisors, rounded to one decimal"
      - name: avg_gpa
        description: "Average current GPA for students in this major (0-4)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 4
      - name: avg_completion_rate_pct
        description: "Average course completion rate expressed as a percentage (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_assignment_score
        description: "Average of students' average assignment scores (0-100)"
      - name: credit_success_rate
        description: "Total credit hours earned divided by total credit hours attempted, as a percentage (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: at_risk_students
        description: "Number of students in this major with at_risk_flag = true"
      - name: at_risk_percentage
        description: "Percentage of students in this major with at_risk_flag = true (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: high_achievers
        description: "Number of students with academic standing of Dean's List, Honor Roll, Excellent Standing, or Distinguished Standing"
      - name: students_on_probation
        description: "Number of students with academic standing of Academic Probation, Academic Warning, Probationary Status, or Academic Suspension"
      - name: probation_rate
        description: "students_on_probation as a percentage of students in this major (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_engagement_score
        description: "Average engagement score for the major (0-100)"
      - name: avg_course_views
        description: "Average course material views per student, rounded to a whole number"
      - name: total_plagiarism_incidents
        description: "Total academic integrity violations across students in this major"
      - name: avg_writing_quality_score
        description: "Average writing quality score (0-100)"
      - name: total_interventions
        description: "Total academic interventions/support sessions across students in this major"
      - name: avg_interventions_per_student
        description: "Average interventions per student"
      - name: total_financial_aid
        description: "Total financial aid received by students in this major"
      - name: avg_financial_aid_per_student
        description: "Average financial aid amount per student, including students with no aid"
      - name: financial_aid_coverage_pct
        description: "Percentage of students in this major with financial_aid_amount > 0 (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: program_health_score
        description: "Weighted composite score (0-100): 25% average GPA (out of 4.0), 25% average completion rate, 25% average engagement score (out of 100), and 25% retention (1 minus at-risk share)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: overall_health_rank
        description: "Rank of program_health_score across majors (1 = healthiest; ties share a rank)"
      - name: performance_quartile
        description: "Quartile of program_health_score across majors via ntile(4): 1 = top quartile, 4 = bottom quartile"
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: performance_category
        description: "Label for performance_quartile: Top Performing (1), Above Average (2), Below Average (3), Needs Improvement (4)"
        data_tests:
          - not_null


  - name: vw_hed_engagement_analytics
    description: "Student-level engagement analysis examining LMS login patterns, course interactions, assignment behavior, and discussion participation. Identifies engagement concerns and recommends actions, ordered by urgency."
    columns:
      - name: student_id
        description: "Unique student identifier"
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: student
      - name: major_code
        description: "Student's academic major"
        dimension:
          type: categorical
      - name: academic_standing
        description: "Current academic status"
        dimension:
          type: categorical
      - name: at_risk_flag
        description: "Retention risk indicator"
        dimension:
          type: categorical
          name: is_at_risk
      - name: last_login_date
        description: "Most recent LMS login timestamp"
        dimension:
          type: time
        granularity: day
      - name: days_since_last_login
        description: "Days elapsed since last login"
      - name: days_active_since_enrollment
        description: "Days between enrollment and last login"
      - name: login_recency_category
        description: "Categorical description of login recency"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: total_course_views
        description: "Total course material views"
      - name: course_views_category
        description: "Categorical classification of course viewing behavior"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: assignment_submissions
        description: "Number of assignments submitted"
      - name: avg_assignment_score
        description: "Average assignment score"
      - name: assignment_activity_category
        description: "Categorical classification of assignment activity"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: assignment_performance_category
        description: "Categorical classification of assignment performance"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: discussion_posts
        description: "Number of discussion forum posts"
      - name: discussion_participation_category
        description: "Categorical classification of discussion participation"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: engagement_score
        description: "Composite engagement metric (0-100)"
      - name: engagement_level
        description: "Qualitative engagement level classification"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: engagement_balance_score
        description: "Normalized score measuring diversity of engagement across dimensions"
      - name: current_gpa
        description: "Current cumulative GPA on a 0-4 scale"
      - name: course_completion_rate
        description: "Share of courses completed, on a 0-1 scale"

      - name: intervention_count
        description: "Number of interventions received"
      - name: engagement_performance_quadrant
        description: "Classification combining engagement and academic performance"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: engagement_concern_level
        description: "Urgency classification for engagement-related concerns"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: recommended_engagement_action
        description: "Specific recommended actions to improve or maintain engagement"
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: enrollment_date
        description: "Date the student enrolled"
        dimension:
          type: time
        granularity: day
      - name: last_updated
        description: "Timestamp of last source record update"
        dimension:
          type: time
        granularity: day

    semantic_model:
      enabled: true
    agg_time_dimension: last_login_date
    metrics:
      - name: days_since_last_login
        type: simple
        label: Days Since Last Login
        agg: sum
      - name: days_active_since_enrollment
        type: simple
        label: Days Active Since Enrollment
        agg: sum
      - name: total_course_views
        type: simple
        label: Total Course Views
        agg: sum
      - name: assignment_submissions
        type: simple
        label: Assignment Submissions
        agg: sum
      - name: avg_assignment_score
        type: simple
        label: Average Assignment Score
        agg: average
      - name: discussion_posts
        type: simple
        label: Discussion Posts
        agg: sum
      - name: engagement_score
        type: simple
        label: Engagement Score
        agg: average
      - name: engagement_balance_score
        type: simple
        label: Engagement Balance Score
        agg: average
      - name: current_gpa
        type: simple
        label: Current GPA
        agg: average
      - name: course_completion_rate
        type: simple
        label: Course Completion Rate
        agg: average
      - name: intervention_count
        type: simple
        label: Intervention Count
        agg: sum
      - name: count_student
        type: simple
        label: Student Count
        agg: count
        expr: STUDENT_ID

  - name: vw_hed_data_quality
    description: "Single-row data quality summary combining the four dq_hed__* component models (completeness, validity, duplicates, freshness) into dimension scores, a composite quality score, and a qualitative status. Recomputed every time the view is queried."
    columns:
      - name: quality_check_timestamp
        description: "Timestamp when the view was queried (current_timestamp at query time)"
        data_tests:
          - not_null
      - name: report_section
        description: "Constant label identifying the row ('Overall Data Quality Summary')"
      - name: completeness_score
        description: "Required-field completeness score (0-100), from dq_hed__completeness.overall_completeness_score"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: validity_score
        description: "Range and logic validity score (0-100), from dq_hed__validity.overall_validity_score"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: uniqueness_score
        description: "Percentage of records with a distinct student_id (0-100), from dq_hed__duplicates.student_uniqueness_pct. Falls below 100 when a student has more than one record."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: freshness_score
        description: "Percentage of records updated within the last 7 days (0-100), from dq_hed__freshness.records_current_pct"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: composite_quality_score
        description: "Simple average of completeness, validity, uniqueness, and freshness scores, rounded to one decimal (0-100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: overall_quality_status
        description: "Status derived from composite_quality_score: Excellent (>= 95), Good (>= 85), Acceptable (>= 70), Needs Improvement (< 70)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Excellent', 'Good', 'Acceptable', 'Needs Improvement']
      - name: total_records
        description: "Total number of records in stg_hed__students"
        data_tests:
          - not_null
      - name: unique_students
        description: "Number of distinct student IDs in stg_hed__students"
      - name: most_recent_data_update
        description: "Most recent last_updated timestamp across all student records"
      - name: hours_since_last_update
        description: "Hours elapsed between most_recent_data_update and query time"
