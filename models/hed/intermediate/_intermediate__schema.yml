        - {student_id: 6, login_recency_category: Over 2 Weeks Ago, course_views_category: Moderate, assignment_activity_category: Moderate, assignment_performance_category: Satisfactory, discussion_participation_category: Moderate, engagement_level: Moderately Engaged, engagement_performance_quadrant: Low Engagement / Low Performance, engagement_concern_level: Elevated Concern - Declining Engagement, recommended_engagement_action: Monitor ongoing; Maintain regular touchpoints}
        - {student_id: 7, login_recency_category: Within 3 Days, course_views_category: Low, assignment_activity_category: Very Low, assignment_performance_category: Satisfactory, discussion_participation_category: Minimal, engagement_level: Moderately Engaged, engagement_performance_quadrant: Low Engagement / Low Performance, engagement_concern_level: Moderate Concern - Minimal Participation, recommended_engagement_action: Connect with instructor; Offer tutoring support}
