version: 2

models:
  - name: int_hed__risk_levels
    description: "Intermediate model providing centralized risk categorization logic. Calculates GPA risk, completion risk, engagement risk, login recency risk, and overall risk assessment used by downstream retention analysis models."
    columns:
      - name: student_id
        description: "Unique student identifier"
        data_tests:
          - not_null
          - unique
      - name: gpa_risk_level
        description: "Risk categorization based on GPA (Critical/High/Moderate/Low)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: completion_risk_level
        description: "Risk categorization based on course completion rate"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: engagement_risk_level
        description: "Risk categorization based on engagement score"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: login_recency_risk_level
        description: "Risk categorization based on days since last login"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Moderate', 'Low']
      - name: financial_aid_category
        description: "Financial aid classification (No Aid/Partial Aid/Full Support)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Aid', 'Partial Aid', 'Full Support']
      - name: intervention_category
        description: "Intervention frequency classification"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Intervention', 'Low Intervention', 'Moderate Intervention', 'High Intervention']
      - name: overall_risk_assessment
        description: "Composite risk level combining all dimensions"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical - Immediate Intervention', 'High - Priority Attention', 'Moderate - Monitor Closely', 'Low - Standard Support']
      - name: recommended_action
        description: "Recommended interventions based on risk profile"
        data_tests:
          - not_null

  - name: int_hed__engagement_categories
    description: "Intermediate model providing centralized engagement categorization logic. Calculates login recency, course views, assignment activity, discussion participation, and engagement levels used by downstream engagement analytics models."
    columns:
      - name: student_id
        description: "Unique student identifier"
        data_tests:
          - not_null
          - unique
      - name: login_recency_category
        description: "Categorical description of login recency (Today, Within 24 Hours, etc.)"
        data_tests:
          - not_null
      - name: course_views_category
        description: "Course viewing behavior category (Very High/High/Moderate/Low/Very Low)"
        data_tests:
          - not_null
      - name: assignment_activity_category
        description: "Assignment submission activity level"
        data_tests:
          - not_null
      - name: assignment_performance_category
        description: "Assignment score performance category"
        data_tests:
          - not_null
      - name: discussion_participation_category
        description: "Discussion forum participation level"
        data_tests:
          - not_null
      - name: engagement_level
        description: "Overall engagement classification (Highly Engaged to Critically Disengaged)"
        data_tests:
          - not_null
      - name: engagement_balance_score
        description: "Normalized score measuring diversity of engagement across dimensions"
      - name: engagement_performance_quadrant
        description: "Classification combining engagement and academic performance"
        data_tests:
          - not_null
      - name: engagement_concern_level
        description: "Urgency classification for engagement-related concerns"
        data_tests:
          - not_null
      - name: recommended_engagement_action
        description: "Specific recommended actions based on engagement profile"
        data_tests:
          - not_null


unit_tests:
  - name: test_risk_level_threshold_boundaries
    description: "Risk classifications remain stable at GPA and login-recency boundaries."
    model: int_hed__risk_levels
    given:
      - input: ref('stg_hed__students')
        rows:
          - student_id: gpa_critical
            record_id: rec_1
            current_gpa: 1.99
            course_completion_rate: 0.90
            engagement_score: 80
            days_since_last_login: 0
            financial_aid_amount: 0
            intervention_count: 0
          - student_id: gpa_high_boundary
            record_id: rec_2
            current_gpa: 2.00
            course_completion_rate: 0.90
            engagement_score: 80
            days_since_last_login: 0
            financial_aid_amount: 0
            intervention_count: 0
          - student_id: gpa_moderate_boundary
            record_id: rec_3
            current_gpa: 2.50
            course_completion_rate: 0.90
            engagement_score: 80
            days_since_last_login: 0
            financial_aid_amount: 0
            intervention_count: 0
          - student_id: login_high_boundary
            record_id: rec_4
            current_gpa: 3.00
            course_completion_rate: 0.90
            engagement_score: 80
            days_since_last_login: 14
            financial_aid_amount: 0
            intervention_count: 0
          - student_id: login_critical
            record_id: rec_5
            current_gpa: 3.00
            course_completion_rate: 0.90
            engagement_score: 80
            days_since_last_login: 15
            financial_aid_amount: 0
            intervention_count: 0
    expect:
      rows:
        - student_id: gpa_critical
          gpa_risk_level: Critical
          login_recency_risk_level: Low
          overall_risk_assessment: Critical - Immediate Intervention
        - student_id: gpa_high_boundary
          gpa_risk_level: High
          login_recency_risk_level: Low
          overall_risk_assessment: High - Priority Attention
        - student_id: gpa_moderate_boundary
          gpa_risk_level: Moderate
          login_recency_risk_level: Low
          overall_risk_assessment: Moderate - Monitor Closely
        - student_id: login_high_boundary
          gpa_risk_level: Low
          login_recency_risk_level: High
          overall_risk_assessment: High - Priority Attention
        - student_id: login_critical
          gpa_risk_level: Low
          login_recency_risk_level: Critical
          overall_risk_assessment: Critical - Immediate Intervention

  - name: test_low_risk_recommendation
    description: "A student with low risk in every dimension receives the standard-support classification."
    model: int_hed__risk_levels
    given:
      - input: ref('stg_hed__students')
        rows:
          - student_id: low_risk
            record_id: rec_low
            current_gpa: 3.50
            course_completion_rate: 0.95
            engagement_score: 85
            days_since_last_login: 1
            financial_aid_amount: 12000
            intervention_count: 0
    expect:
      rows:
        - student_id: low_risk
          gpa_risk_level: Low
          completion_risk_level: Low
          engagement_risk_level: Low
          login_recency_risk_level: Low
          overall_risk_assessment: Low - Standard Support
          recommended_action: "Continue standard support; Celebrate successes; Maintain engagement"


  - name: test_completion_and_engagement_threshold_boundaries
    description: "Completion and engagement classifications remain stable on both sides of each cutoff."
    model: int_hed__risk_levels
    given:
      - input: ref('stg_hed__students')
        rows:
          - {student_id: completion_critical, record_id: rec_c1, current_gpa: 3.5, course_completion_rate: 0.49, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: completion_high, record_id: rec_c2, current_gpa: 3.5, course_completion_rate: 0.50, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: completion_moderate, record_id: rec_c3, current_gpa: 3.5, course_completion_rate: 0.70, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: completion_low, record_id: rec_c4, current_gpa: 3.5, course_completion_rate: 0.85, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: engagement_critical, record_id: rec_e1, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 29, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: engagement_high, record_id: rec_e2, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 30, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: engagement_moderate, record_id: rec_e3, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 50, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: engagement_low, record_id: rec_e4, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 70, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
    expect:
      rows:
        - {student_id: completion_critical, completion_risk_level: Critical, engagement_risk_level: Low}
        - {student_id: completion_high, completion_risk_level: High, engagement_risk_level: Low}
        - {student_id: completion_moderate, completion_risk_level: Moderate, engagement_risk_level: Low}
        - {student_id: completion_low, completion_risk_level: Low, engagement_risk_level: Low}
        - {student_id: engagement_critical, completion_risk_level: Low, engagement_risk_level: Critical}
        - {student_id: engagement_high, completion_risk_level: Low, engagement_risk_level: High}
        - {student_id: engagement_moderate, completion_risk_level: Low, engagement_risk_level: Moderate}
        - {student_id: engagement_low, completion_risk_level: Low, engagement_risk_level: Low}


  - name: test_critical_risk_takes_precedence
    description: "Any critical dimension overrides otherwise moderate or low risk dimensions."
    model: int_hed__risk_levels
    given:
      - input: ref('stg_hed__students')
        rows:
          - student_id: mixed_risk
            record_id: rec_mixed
            current_gpa: 2.75
            course_completion_rate: 0.90
            engagement_score: 29
            days_since_last_login: 0
            financial_aid_amount: 5000
            intervention_count: 1
    expect:
      rows:
        - student_id: mixed_risk
          gpa_risk_level: Moderate
          completion_risk_level: Low
          engagement_risk_level: Critical
          login_recency_risk_level: Low
          overall_risk_assessment: Critical - Immediate Intervention
          recommended_action: "Schedule mandatory advisor meeting; Review academic plan; Connect with tutoring/counseling; Verify financial aid status"

  - name: test_support_category_boundaries
    description: "Financial-aid and intervention category labels remain stable at their boundaries."
    model: int_hed__risk_levels
    given:
      - input: ref('stg_hed__students')
        rows:
          - {student_id: no_aid, record_id: rec_s1, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 0, intervention_count: 0}
          - {student_id: partial_aid, record_id: rec_s2, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 9999, intervention_count: 1}
          - {student_id: full_support, record_id: rec_s3, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 10000, intervention_count: 2}
          - {student_id: high_intervention, record_id: rec_s4, current_gpa: 3.5, course_completion_rate: 0.90, engagement_score: 80, days_since_last_login: 0, financial_aid_amount: 10000, intervention_count: 5}
    expect:
      rows:
        - {student_id: no_aid, financial_aid_category: No Aid, intervention_category: No Intervention}
        - {student_id: partial_aid, financial_aid_category: Partial Aid, intervention_category: Low Intervention}
        - {student_id: full_support, financial_aid_category: Full Support, intervention_category: Moderate Intervention}
        - {student_id: high_intervention, financial_aid_category: Full Support, intervention_category: High Intervention}
