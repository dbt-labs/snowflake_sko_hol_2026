            total_course_views: 50
            assignment_submissions: 10
            discussion_posts: 5
            financial_aid_amount: 0
            intervention_count: 0
            plagiarism_incidents: 0
            writing_quality_score: 88
            enrollment_date: 2024-09-01
            last_login_date: 2024-09-10
            last_updated: 2024-09-10 12:00:00
          - student_id: s_high
            record_id: 2
            advisor_id: adv_2
            major_code: BUSN
            academic_standing: Good Standing
            at_risk_flag: true
            current_gpa: 2.0
            course_completion_rate: 0.70
            engagement_score: 49
            days_since_last_login: 5
            total_course_views: 40
            assignment_submissions: 8
            discussion_posts: 4
            financial_aid_amount: 5000
            intervention_count: 1
            plagiarism_incidents: 0
            writing_quality_score: 82
            enrollment_date: 2024-09-01
            last_login_date: 2024-09-08
            last_updated: 2024-09-10 12:00:00
          - student_id: s_moderate
