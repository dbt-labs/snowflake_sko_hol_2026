version: 2

sources:
  - name: fts
    description: >
      Field Technician Service (FTS) data for energy/utilities maintenance operations.
      Contains maintenance logs, equipment reliability metrics, technician activities,
      and operational efficiency data from Fivetran Industries connector.
    database: "{{ var('fts_source_database', 'HOL_DATABASE') }}"
    schema: "{{ var('fts_source_schema', '    schema: INDUSTRIES_ENERGY') }}"

    tables:
      - name: fts_records
        description: >
          Primary table containing field service maintenance logs with equipment
          reliability tracking, technician activities, and cost/downtime metrics.
        columns:
          - name: record_id
            description: Unique identifier for each maintenance record
            tests:
              - unique
              - not_null
          
          - name: log_date
            description: Date the maintenance activity was logged
            tests:
              - not_null
          
          - name: technician_id
            description: Identifier for the technician performing maintenance
          
          - name: log_description
            description: Detailed description of maintenance activity performed
          
          - name: equipment_id
            description: Identifier for the equipment being maintained
          
          - name: maintenance_type
            description: Type of maintenance strategy applied
            tests:
              - accepted_values:
                  arguments:
                    values: 
                      - 'Preventive Maintenance'
                      - 'Predictive Maintenance'
                      - 'Corrective Maintenance'
                      - 'Condition-Based Maintenance'
                      - 'Reliability-Centered Maintenance'
          
          - name: maintenance_status
            description: Current status of the maintenance activity
            tests:
              - accepted_values:
                  arguments:
                    values: 
                      - 'Scheduled'
                      - 'In Progress'
                      - 'Completed'
                      - 'Delayed'
                      - 'Cancelled'
          
          - name: erp_order_id
            description: ERP system work order identifier
          
          - name: customer_id
            description: Customer/facility identifier for the equipment
          
          - name: summarized_log
            description: AI-summarized maintenance log for quick reference
          
          - name: failure_rate
            description: Equipment failure rate (0-1 scale, 0=reliable, 1=frequent failures)
          
          - name: maintenance_cost
            description: Cost of maintenance activity in USD
          
          - name: downtime_hours
            description: Equipment downtime duration in hours
          
          - name: summarization_time_saved
            description: Time saved (in hours) through AI log summarization
