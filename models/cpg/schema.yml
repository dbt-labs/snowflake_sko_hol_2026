version: 2

models:
  - name: vw_cpg_pricing_optimization_kpi
    description: >
      Executive KPI dashboard tracking the effectiveness of dynamic pricing strategies.
      Provides success rates, revenue impact, price elasticity insights, and category
      performance for pricing optimization initiatives.
    config:
      tags: ['cpg', 'analytics', 'pricing', 'kpi']
    columns:
      - name: total_orders
        description: Total number of orders across all products
      - name: optimized_orders
        description: Number of orders with active price optimization
      - name: optimization_rate_pct
        description: Percentage of orders using price optimization
      - name: success_rate_pct
        description: Success rate of price optimization attempts
      - name: total_revenue
        description: Total revenue across all orders
      - name: revenue_from_optimized_pricing
        description: Revenue generated from orders with price optimization
      - name: pricing_lift_pct
        description: Percentage lift in order value from price optimization
      - name: avg_price_elasticity
        description: Average price elasticity across all products
      - name: best_optimization_category
        description: Product category with highest optimization success rate

  - name: vw_cpg_inventory_health_by_category
    description: >
      Inventory management dashboard segmented by product category. Tracks turnover
      rates, stockout/overstock risks, and provides inventory health scores with
      actionable recommendations for each category.
    config:
      tags: ['cpg', 'analytics', 'inventory', 'operations']
    columns:
      - name: product_category
        description: Product category name
      - name: total_orders
        description: Total orders for this category
      - name: avg_inventory_level
        description: Average inventory level maintained
      - name: avg_inventory_turnover
        description: Average inventory turnover ratio
      - name: turnover_health_status
        description: Classification of turnover performance (Excellent/Good/Fair/Poor)
      - name: stockout_risk_level
        description: Stockout risk assessment (Low/Medium/High Risk)
      - name: overstock_risk_level
        description: Overstock risk assessment (Low/Medium/High Risk)
      - name: inventory_health_score
        description: Overall inventory health score (0-100)
      - name: overall_health_status
        description: Overall health classification
      - name: recommended_action
        description: Specific recommendation for improving inventory performance

  - name: vw_cpg_customer_segment_performance
    description: >
      Customer segmentation analysis comparing High-Value, Medium-Value, and Low-Value
      customer segments. Tracks LTV, order behavior, satisfaction metrics, and provides
      strategic recommendations for each segment.
    config:
      tags: ['cpg', 'analytics', 'customer', 'segmentation']
    columns:
      - name: customer_segment
        description: Customer value segment (High-Value, Medium-Value, Low-Value)
      - name: unique_customers
        description: Number of unique customers in segment
      - name: avg_customer_ltv
        description: Average customer lifetime value
      - name: avg_order_frequency
        description: Average number of orders per customer
      - name: avg_order_value
        description: Average order value for segment
      - name: total_segment_revenue
        description: Total revenue generated by segment
      - name: revenue_per_customer
        description: Average revenue per customer
      - name: avg_satisfaction_rate_pct
        description: Average customer satisfaction rate
      - name: preferred_category
        description: Most popular product category for this segment
      - name: segment_health_score
        description: Overall segment health score (0-100)
      - name: recommended_strategy
        description: Strategic recommendation for this customer segment

  - name: vw_cpg_demand_forecast_accuracy
    description: >
      Demand forecasting quality dashboard. Monitors forecast accuracy by demand tier,
      correlates with order fulfillment rates, and identifies forecasting improvement
      opportunities through inventory positioning analysis.
    config:
      tags: ['cpg', 'analytics', 'forecasting', 'planning']
    columns:
      - name: demand_tier
        description: Demand forecast tier (Low/Medium/High/Very High Demand)
      - name: total_orders
        description: Total orders in this demand tier
      - name: avg_demand_forecast
        description: Average forecasted demand units
      - name: well_stocked_pct
        description: Percentage of products with adequate inventory
      - name: fulfillment_rate_pct
        description: Percentage of orders successfully fulfilled
      - name: cancellation_rate_pct
        description: Percentage of orders cancelled
      - name: forecast_accuracy_score
        description: Overall forecast quality score (0-100)
      - name: forecast_quality_status
        description: Forecast quality classification
      - name: recommended_action
        description: Specific recommendation for improving forecast accuracy

  - name: vw_cpg_data_quality
    description: >
      Comprehensive data quality monitoring view. Tracks completeness, freshness,
      duplicate detection, value validation, and consistency checks. Provides an
      overall data quality score and actionable recommendations.
    config:
      tags: ['cpg', 'data_quality', 'monitoring']
    columns:
      - name: total_records
        description: Total number of records in source table
      - name: active_records
        description: Number of active (non-deleted) records
      - name: overall_completeness_score
        description: Completeness score for critical fields (0-100)
      - name: duplicate_record_ids
        description: Number of duplicate record IDs detected
      - name: total_validation_issues
        description: Total count of value validation issues
      - name: overall_data_quality_score
        description: Overall data quality score (0-100)
      - name: last_sync_time
        description: Timestamp of last Fivetran sync
      - name: hours_since_last_sync
        description: Hours elapsed since last sync
      - name: data_freshness_status
        description: Freshness classification (Fresh/Recent/Aging/Stale)
      - name: data_quality_status
        description: Overall quality classification
      - name: recommended_action
        description: Priority action to improve data quality
