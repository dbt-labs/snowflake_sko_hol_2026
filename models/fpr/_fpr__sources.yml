version: 2

sources:
  - name: fpr
    description: "Financial Services data from Fivetran industries connector - FPR_RECORDS table"
    database: "{{ var('fpr_source_database', 'HOL_DATABASE') }}"
    schema: "{{ var('fpr_source_schema', 'INDUSTRIES_FINANCIAL_SERVICES') }}"
    
    tables:
      - name: fpr_records
        description: "Financial services customer records including account balances, product recommendations, transaction history, and customer lifecycle tracking"
        
        columns:
          - name: record_id
            description: "Unique identifier for each financial record"
            tests:
              - unique
              - not_null
          
          - name: customer_id
            description: "Unique customer identifier"
            tests:
              - not_null
          
          - name: customer_name
            description: "Customer full name"
          
          - name: customer_email
            description: "Customer email address"
          
          - name: account_balance
            description: "Current account balance for the customer"
          
          - name: transaction_history
            description: "Historical transaction summary"
          
          - name: product_id
            description: "Product identifier"
          
          - name: product_name
            description: "Product name"
          
          - name: product_type
            description: "Type of financial product (Auto Loan, Checking Account, Credit Card, Mortgage, Personal Loan, Savings Account, Student Loan)"
          
          - name: product_terms
            description: "Product terms and conditions category (Short Term, Long Term, Fixed Rate, Variable Rate, Low Interest, etc.)"
          
          - name: product_recommendation
            description: "Recommended product for cross-sell opportunity"
          
          - name: recommendation_score
            description: "Score indicating strength of product recommendation (0-1 scale)"
          
          - name: customer_segment
            description: "Customer segmentation category (Commercial, Individual, Family, Student, Large Business, Small Business, Retiree, Wealth Management, Private Banking, Retail)"
          
          - name: customer_lifecycle_stage
            description: "Current stage in customer lifecycle (Prospect, Lead, Onboarding, Active, Engaged, Converted, Dormant, Disengaged, Inactive, Churned)"
          
          - name: customer_transaction_value
            description: "Total transaction value for customer"
          
          - name: customer_transaction_count
            description: "Number of transactions for customer"
          
          - name: customer_product_usage
            description: "Product usage pattern description"
          
          - name: customer_product_interests
            description: "Customer's stated product interests"
          
          - name: customer_product_affinity
            description: "Calculated affinity score for product interest (0-1 scale)"
          
          - name: product_sales_date
            description: "Date when product was sold to customer"
          
          - name: product_sales_amount
            description: "Amount of product sale"
          
          - name: customer_satisfaction_score
            description: "Customer satisfaction rating (0-1 scale)"
          
          - name: customer_churn_probability
            description: "Predicted probability of customer churn (0-1 scale, higher = higher risk)"
          
          - name: customer_lifecycle_stage_transition_date
            description: "Date of most recent lifecycle stage change"
          
          - name: product_recommendation_date
            description: "Date when product recommendation was made"
          
          - name: product_recommendation_status
            description: "Status of product recommendation (Approved, Pending, Declined, Rejected, Accepted, In Progress)"
          
          - name: customer_product_usage_trend
            description: "Trend description for product usage"
          
          - name: customer_product_affinity_trend
            description: "Trend description for product affinity"
          
          - name: _fivetran_deleted
            description: "Fivetran soft delete flag"
          
          - name: _fivetran_synced
            description: "Timestamp of last Fivetran sync"
