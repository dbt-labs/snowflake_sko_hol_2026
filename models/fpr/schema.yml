version: 2

models:
  - name: vw_fpr_customer_portfolio_kpi
    description: "Executive KPI dashboard for financial services customer portfolio health, showing key metrics across customer segments, lifecycle stages, and product types. Provides high-level insights into account balances, transaction activity, customer satisfaction, and churn risk."
    columns:
      - name: metric_category
        description: "Category of metric being reported (Portfolio Overview, Customer Segments, Lifecycle Stages, Product Distribution)"
      
      - name: metric_name
        description: "Specific metric name"
      
      - name: metric_value
        description: "Calculated value for the metric"
      
      - name: segment_detail
        description: "Customer segment breakdown (when applicable)"
      
      - name: lifecycle_detail
        description: "Lifecycle stage breakdown (when applicable)"
      
      - name: product_detail
        description: "Product type breakdown (when applicable)"
      
      - name: last_synced_at
        description: "Timestamp of most recent data sync from source"

  - name: vw_fpr_product_recommendation_performance
    description: "Analysis of product recommendation effectiveness showing approval rates, conversion metrics, and performance by product type and customer segment. Helps optimize cross-sell and upsell strategies by identifying which recommendations drive the best results."
    columns:
      - name: recommended_product
        description: "Product being recommended for cross-sell/upsell"
      
      - name: actual_product_type
        description: "Customer's current product type"
      
      - name: customer_segment
        description: "Customer segmentation category"
      
      - name: total_recommendations
        description: "Total number of recommendations made"
      
      - name: approved_count
        description: "Number of recommendations with Approved status"
      
      - name: pending_count
        description: "Number of recommendations with Pending status"
      
      - name: declined_count
        description: "Number of recommendations with Declined or Rejected status"
      
      - name: in_progress_count
        description: "Number of recommendations In Progress"
      
      - name: approval_rate_pct
        description: "Percentage of recommendations approved"
      
      - name: avg_recommendation_score
        description: "Average recommendation score (0-1)"
      
      - name: avg_approved_score
        description: "Average score for approved recommendations"
      
      - name: avg_declined_score
        description: "Average score for declined/rejected recommendations"
      
      - name: avg_product_affinity
        description: "Average customer product affinity score"
      
      - name: avg_days_to_decision
        description: "Average days from recommendation date to status change"
      
      - name: total_sales_amount
        description: "Total dollar value of sales from approved recommendations"
      
      - name: avg_sales_amount
        description: "Average sale amount per approved recommendation"
      
      - name: last_synced_at
        description: "Timestamp of most recent data sync"

  - name: vw_fpr_churn_risk_analysis
    description: "Customer churn risk analysis identifying at-risk customers and patterns by segment, lifecycle stage, and product type. Enables proactive retention efforts by highlighting customers with high churn probability and their key characteristics."
    columns:
      - name: risk_category
        description: "Churn risk category (High Risk >0.7, Medium Risk 0.4-0.7, Low Risk <0.4)"
      
      - name: customer_segment
        description: "Customer segmentation category"
      
      - name: lifecycle_stage
        description: "Current customer lifecycle stage"
      
      - name: product_type
        description: "Financial product type held by customer"
      
      - name: customer_count
        description: "Number of customers in this category"
      
      - name: avg_churn_probability
        description: "Average churn probability for group (0-1 scale)"
      
      - name: avg_satisfaction_score
        description: "Average customer satisfaction score"
      
      - name: total_account_balance
        description: "Total account balance at risk in this group"
      
      - name: avg_account_balance
        description: "Average account balance per customer"
      
      - name: avg_transaction_value
        description: "Average transaction value per customer"
      
      - name: avg_transaction_count
        description: "Average number of transactions per customer"
      
      - name: avg_days_since_lifecycle_change
        description: "Average days since last lifecycle stage transition"
      
      - name: declined_recommendations_pct
        description: "Percentage of customers with declined product recommendations"
      
      - name: last_synced_at
        description: "Timestamp of most recent data sync"

  - name: vw_fpr_data_quality
    description: "Data quality monitoring view tracking completeness, freshness, integrity, and validity of financial services records. Provides key metrics for data governance and pipeline health monitoring."
    columns:
      - name: quality_check_category
        description: "Category of data quality check (Completeness, Integrity, Freshness, Validity)"
      
      - name: check_name
        description: "Specific quality check performed"
      
      - name: check_result
        description: "Result value or status of the check"
      
      - name: threshold_status
        description: "Whether check passes quality thresholds (Pass/Warning/Fail)"
      
      - name: record_count
        description: "Number of records affected (when applicable)"
      
      - name: percentage
        description: "Percentage value for the check (when applicable)"
      
      - name: measured_at
        description: "Timestamp when quality check was performed"

  - name: vw_fpr_high_value_engagement_alerts
    description: "Operational alerts view identifying high-value customers requiring immediate attention due to churn risk, engagement issues, or declined recommendations. Enables proactive relationship management and retention intervention."
    columns:
      - name: alert_priority
        description: "Alert priority level (Critical, High, Medium)"
      
      - name: alert_type
        description: "Type of alert (High Balance + High Churn, Declined Recommendation, Stalled Lifecycle, Disengaged High Spender, Low Satisfaction + High Affinity)"
      
      - name: customer_id
        description: "Unique customer identifier requiring attention"
      
      - name: customer_name
        description: "Customer name"
      
      - name: customer_email
        description: "Customer email for outreach"
      
      - name: customer_segment
        description: "Customer segment category"
      
      - name: lifecycle_stage
        description: "Current lifecycle stage"
      
      - name: account_balance
        description: "Customer account balance"
      
      - name: churn_probability
        description: "Predicted churn probability (0-1)"
      
      - name: satisfaction_score
        description: "Customer satisfaction score (0-1)"
      
      - name: transaction_value
        description: "Total transaction value"
      
      - name: product_type
        description: "Current product type"
      
      - name: product_affinity
        description: "Product affinity score"
      
      - name: recommendation_status
        description: "Status of product recommendation"
      
      - name: days_since_lifecycle_change
        description: "Days since last lifecycle transition"
      
      - name: days_since_recommendation
        description: "Days since product recommendation made"
      
      - name: alert_reason
        description: "Detailed explanation of why this customer triggered an alert"
      
      - name: recommended_action
        description: "Suggested action for account manager"
      
      - name: last_synced_at
        description: "Timestamp of most recent data sync"
